version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: dci-mysql
    restart: always
    environment:
      MYSQL_DATABASE: dci_platform
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword" ]
      timeout: 5s
      retries: 10
      interval: 3s
    networks:
      - dci-network

  migration:
    image: node:24-alpine
    container_name: dci-migration
    working_dir: /app
    environment:
      - DATABASE_URL=mysql://root:rootpassword@db:3306/dci_platform
    volumes:
      - .:/app
      - /app/node_modules # Anonymous volume to isolate node_modules
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        npm install --no-audit --no-fund &&
        npx prisma generate --schema=src/prisma/schema.prisma &&
        npx prisma migrate deploy --schema=src/prisma/schema.prisma &&
        npx prisma db seed --schema=src/prisma/schema.prisma
      "
    networks:
      - dci-network

  adminer:
    image: adminer:latest
    container_name: dci-adminer
    restart: always
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_DB_DRIVER: mysql
    networks:
      - dci-network

volumes:
  mysql-data:

networks:
  dci-network:
    driver: bridge
